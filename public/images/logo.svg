<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 바깥 육각형 (진한 파란색 테두리) -->
  <polygon points="60,4 110,32 110,88 60,116 10,88 10,32"
    fill="#1e3a8a" stroke="#2563eb" stroke-width="2"/>
  <!-- 안쪽 배경 (약간 어두운 네이비) -->
  <polygon points="60,16 100,38 100,82 60,104 20,82 20,38"
    fill="#0f172a"/>
  <!-- 3D 큐브 상단면 (밝은 파란색) -->
  <polygon points="60,24 94,43 60,62 26,43"
    fill="#2563eb"/>
  <!-- 3D 큐브 좌측면 (중간 파란색) -->
  <polygon points="26,43 60,62 60,96 26,77"
    fill="#1d4ed8"/>
  <!-- 3D 큐브 우측면 (연한 파란색/흰색) -->
  <polygon points="94,43 60,62 60,96 94,77"
    fill="#60a5fa"/>
  <!-- 큐브 엣지 강조선 -->
  <line x1="60" y1="24" x2="60" y2="62" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="60" y1="62" x2="60" y2="96" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
</svg>
